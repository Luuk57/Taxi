<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Tasker - Taxi Module</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
    .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    
    /* Grote knoppen voor Start en Stop */
    .time-buttons-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .big-btn { flex: 1; padding: 15px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: center; transition: background 0.3s; }
    .btn-start { background: #27ae60; }
    .btn-start:hover { background: #219653; }
    .btn-stop { background: #c0392b; }
    .btn-stop:hover { background: #a93226; }
    .time-display { font-size: 14px; margin-top: 5px; color: #555; font-weight: normal; }

    .primary-button { background: #3498db; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; transition: background 0.3s; }
    .primary-button:hover { background: #2980b9; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>

<div class="container">
  <h2>Taxi Afspraak Inplannen</h2>
  
  <div class="form-group">
    <label for="taxiDatum">Datum:</label>
    <input type="date" id="taxiDatum">
  </div>

  <div class="form-group">
    <label for="taxiTijd">Ophaaltijd:</label>
    <input type="time" id="taxiTijd">
  </div>

  <div class="form-group">
    <label for="bestemming">Bestemming (bijv. Ziekenhuis):</label>
    <input type="text" id="bestemming" placeholder="Waar naartoe?">
  </div>

  <!-- Grote Start en Stop knoppen -->
  <label>Tijden vastleggen:</label>
  <div class="time-buttons-container">
    <button type="button" class="big-btn btn-start" onclick="legStartTijdVast()">
      Start Tijd
      <div class="time-display" id="displayStart">Nog niet ingesteld</div>
    </button>
    <button type="button" class="big-btn btn-stop" onclick="legStopTijdVast()">
      Stop Tijd
      <div class="time-display" id="displayStop">Nog niet ingesteld</div>
    </button>
  </div>

  <div class="form-group">
    <label for="herhaling">Herhaling:</label>
    <select id="herhaling">
      <option value="Geen">Geen</option>
      <option value="ma wo vrij">ma wo vrij</option>
      <option value="di do vrij">di do vrij</option>
      <option value="elke dag">elke dag</option>
      <option value="om de dag">om de dag</option>
    </select>
  </div>

  <div class="form-group">
    <label for="herhalingEinddatum">Herhalen tot datum:</label>
    <input type="date" id="herhalingEinddatum">
  </div>

  <div class="form-group">
    <label for="opmerking">Opmerking:</label>
    <input type="text" id="opmerking" placeholder="Bijv. Rolstoel mee...">
  </div>
  
  <button class="primary-button" id="btnSaveTaxi" onclick="slaTaxiOp()">+ Taxi Opslaan</button>

  <h2>Geplande Taxiritten</h2>
  <table id="taxiTable">
    <thead>
      <tr>
        <th>Datum</th>
        <th>Tijd</th>
        <th>Bestemming</th>
        <th>Start/Stop</th>
        <th>Herhaling</th>
        <th>Opmerking</th>
      </tr>
    </thead>
    <tbody id="taxiBody">
      <!-- Wordt automatisch gevuld -->
    </tbody>
  </table>
</div>

<script>
  let opgeslagenStartTijd = '';
  let opgeslagenStopTijd = '';

  // Functie om de starttijd vast te leggen via de grote knop
  function legStartTijdVast() {
    const nu = new Date();
    opgeslagenStartTijd = nu.toTimeString().split(' ')[0].substring(0, 5); // HH:MM
    document.getElementById('displayStart').textContent = 'Vastgelegd: ' + opgeslagenStartTijd;
  }

  // Functie om de stoptijd vast te leggen via de grote knop
  function legStopTijdVast() {
    const nu = new Date();
    opgeslagenStopTijd = nu.toTimeString().split(' ')[0].substring(0, 5); // HH:MM
    document.getElementById('displayStop').textContent = 'Vastgelegd: ' + opgeslagenStopTijd;
  }

  // Visuele feedback op de opslaanknop
  function geefFeedback(knopId) {
    const knop = document.getElementById(knopId);
    if (!knop) return;
    const oudeTekst = knop.textContent;
    knop.style.background = '#27ae60';
    knop.textContent = 'Opgeslagen! ✓';
    setTimeout(() => {
      knop.style.background = '';
      knop.textContent = oudeTekst;
    }, 1500);
  }

  function slaTaxiOp() {
    const datum = document.getElementById('taxiDatum').value;
    const tijd = document.getElementById('taxiTijd').value;
    const bestemming = document.getElementById('bestemming').value;
    const herhaling = document.getElementById('herhaling').value;
    const herhalingEinddatum = document.getElementById('herhalingEinddatum').value;
    const opmerking = document.getElementById('opmerking').value;

    if (!datum) {
      alert('Kies in ieder geval een datum.');
      return;
    }

    geefFeedback('btnSaveTaxi');

    const data = {
      datum: datum,
      tijd: tijd,
      bestemming: bestemming,
      herhaling: herhaling,
      herhalingEinddatum: herhalingEinddatum,
      startTijd: opgeslagenStartTijd,
      stopTijd: opgeslagenStopTijd,
      opmerking: opmerking
    };

    google.script.run
      .withSuccessHandler(() => {
        // Reset formulier velden
        document.getElementById('bestemming').value = '';
        document.getElementById('opmerking').value = '';
        document.getElementById('taxiTijd').value = '';
        document.getElementById('herhalingEinddatum').value = '';
        opgeslagenStartTijd = '';
        opgeslagenStopTijd = '';
        document.getElementById('displayStart').textContent = 'Nog niet ingesteld';
        document.getElementById('displayStop').textContent = 'Nog niet ingesteld';
        laadTaxiOverzicht();
      })
      .withFailureHandler(err => alert('Fout: ' + err.message))
      .opslaanTaxi(data);
  }

  function laadTaxiOverzicht() {
    google.script.run
      .withSuccessHandler(regels => {
        const tbody = document.getElementById('taxiBody');
        tbody.innerHTML = '';
        
        if (!regels || regels.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Geen ritten gevonden</td></tr>';
          return;
        }

        regels.forEach(item => {
          const tr = document.createElement('tr');
          const startStopInfo = (item.startTijd || item.stopTijd) ? `Start: ${item.startTijd || '-'}<br>Stop: ${item.stopTijd || '-'}` : '-';
          const herhalingInfo = item.herhaling !== 'Geen' ? `${item.herhaling} (t/m ${item.herhalingEinddatum || 'onbekend'})` : 'Geen';

          tr.innerHTML = `
            <td>${item.datum}</td>
            <td>${item.tijd || ''}</td>
            <td>${item.bestemming || ''}</td>
            <td>${startStopInfo}</td>
            <td>${herhalingInfo}</td>
            <td>${item.opmerking || ''}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .getTaxiOverzicht();
  }

  window.onload = function() {
    laadTaxiOverzicht();
  };
</script>

</body>
</html>
