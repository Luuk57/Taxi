
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Vervoer Rittenstaat & Planning</title>
    <style>
        :root {
            --bg-base: #030508;
            --surface-glass: rgba(13, 17, 28, 0.85);
            --surface-card: rgba(18, 24, 38, 0.75);
            --border-glass: rgba(0, 242, 254, 0.2);
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --neon-green: #10b981;
            --neon-orange: #f59e0b;
            --neon-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); min-height: 100vh; padding: 15px; background-image: radial-gradient(circle at 50% 10%, #0c1425 0%, var(--bg-base) 100%); display: flex; flex-direction: column; align-items: center; }

        header { background: var(--surface-glass); border: 1px solid var(--border-glass); border-radius: 14px; padding: 12px 18px; width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; backdrop-filter: blur(10px); }
        .app-title { font-size: 15px; font-weight: 800; color: var(--neon-cyan); letter-spacing: 1px; }
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-glass); color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }

        .auto-pdf-banner { background: rgba(0, 242, 254, 0.1); border: 2px solid var(--neon-cyan); border-radius: 12px; padding: 14px; width: 100%; max-width: 500px; margin-bottom: 15px; display: none; text-align: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,242,254, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0,242,254, 0); } 100% { box-shadow: 0 0 0 0 rgba(0,242,254, 0); } }
        .auto-pdf-title { font-size: 12px; font-weight: 800; color: var(--neon-cyan); text-transform: uppercase; margin-bottom: 6px; }
        .btn-auto-pdf { background: var(--neon-cyan); color: #030508; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; width: 100%; margin-top: 6px; }

        .main-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 15px; }

        .scheduled-banner { background: rgba(245, 158, 11, 0.12); border: 2px solid var(--neon-orange); border-radius: 14px; padding: 15px; width: 100%; text-align: left; display: none; }
        .scheduled-title { font-size: 11px; font-weight: 800; color: var(--neon-orange); text-transform: uppercase; margin-bottom: 5px; }
        .scheduled-details { font-size: 13px; color: var(--text-main); margin-bottom: 10px; font-weight: 600; }
        .btn-start-scheduled { background: var(--neon-orange); color: #030508; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 13px; width: 100%; }

        .meter-card { background: var(--surface-card); border-radius: 16px; padding: 25px; width: 100%; box-shadow: 0 8px 25px rgba(0,0,0,0.4); border: 1px solid var(--border-glass); text-align: center; backdrop-filter: blur(10px); }
        .meter-status { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .timer-display { font-size: 38px; font-weight: 900; color: var(--neon-cyan); margin-bottom: 20px; font-variant-numeric: tabular-nums; text-shadow: 0 0 15px rgba(0,242,254,0.3); }
        
        .action-main-btn { width: 100%; padding: 18px; border: none; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; color: #030508; }
        .btn-start { background: var(--neon-green); box-shadow: 0 0 15px rgba(16,185,129,0.3); }
        .btn-stop { background: var(--neon-red); color: white; box-shadow: 0 0 15px rgba(239,68,68,0.3); }

        .active-ride-form { margin-top: 20px; text-align: left; display: none; }
        .active-ride-form label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; margin-top: 10px; }
        .active-ride-form select, .active-ride-form input, .active-ride-form textarea { width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border-glass); border-radius: 8px; outline: none; background: #070a12; font-weight: 600; color: white; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #0f172a; border: 1px solid var(--border-glass); padding: 22px; border-radius: 16px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 16px; color: var(--neon-cyan); font-size: 17px; font-weight: 700; }
        .modal-content label { display: block; font-size: 11px; font-weight: 700; text-align: left; margin-bottom: 4px; color: var(--text-muted); text-transform: uppercase; margin-top: 10px; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border-glass); border-radius: 8px; margin-bottom: 6px; outline: none; background: #070a12; font-weight: 600; color: white; text-align: left; }
        
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-cancel { background: #1e293b; color: var(--text-muted); }
        .btn-confirm { background: var(--neon-cyan); color: #030508; }
        .btn-excel { background: var(--neon-green); color: #030508; }

        .list-container { max-height: 220px; overflow-y: auto; text-align: left; margin-bottom: 12px; border: 1px solid var(--border-glass); padding: 8px; border-radius: 10px; background: #070a12; }
        .list-card { background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .list-card-header { font-weight: 700; font-size: 13px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        .list-card-row { font-size: 12px; color: var(--text-muted); padding: 2px 0; }
        .delete-btn { background: var(--neon-red); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; }

        .badge-green { background: rgba(16,185,129,0.2); color: var(--neon-green); padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; border: 1px solid var(--neon-green); }
        .badge-red { background: rgba(239,68,68,0.2); color: var(--neon-red); padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; border: 1px solid var(--neon-red); }
        .sync-status { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="app-title">🚕 TAXI MONITOR</div>
            <div class="sync-status" id="syncStatus">Cloud: Niet ingesteld</div>
        </div>
        <div class="header-btns">
            <button class="icon-btn" onclick="openModal('planningModal')" title="Agenda & Planning">📅</button>
            <button class="icon-btn" onclick="openModal('reportModal')" title="Rapport & Export">📄</button>
            <button class="icon-btn" onclick="openModal('diaryModal')" title="Opgeslagen Ritten">📊</button>
            <button class="icon-btn" onclick="openModal('settingsModal')" title="Instellingen & Cloud">☁️</button>
        </div>
    </header>

    <div class="auto-pdf-banner" id="autoPdfBanner">
        <div class="auto-pdf-title">⏰ Tijd bereikt! Dagelijkse Taxi PDF nog niet gemaakt</div>
        <div style="font-size: 12px; color: var(--text-main);">Genereer en download het rapport om de melding te voltooien.</div>
        <button class="btn-auto-pdf" onclick="generateAutoPDF()">📄 GENEREER DAG-PDF NU</button>
    </div>

    <div class="main-container">
        <div class="scheduled-banner" id="scheduledBanner">
            <div class="scheduled-title">📌 Geplande Rit voor Vandaag!</div>
            <div class="scheduled-details" id="scheduledDetailsText"></div>
            <button class="btn-start-scheduled" onclick="startFirstScheduledRide()">Start eerstvolgende rit</button>
        </div>

        <div class="meter-card">
            <div class="meter-status" id="meterStatus">Status: Vrij / Klaar voor rit</div>
            <div class="timer-display" id="timerDisplay">00:00:00</div>

            <button class="action-main-btn btn-start" id="mainActionBtn" onclick="toggleRide()">RIT STARTEN</button>

            <div class="active-ride-form" id="activeRideForm">
                <label>Bedrijf:</label>
                <select id="rideCompany"></select>
                
                <label>Chauffeur:</label>
                <select id="rideDriver"></select>

                <label>Bestemming:</label>
                <select id="rideDestination"></select>

                <label>Opmerking:</label>
                <textarea id="rideNote" rows="2" placeholder="Bijv. bijzonderheden"></textarea>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="planningModal">
        <div class="modal-content">
            <h3>Agenda & Planning</h3>
            <div class="list-container" id="plannedListContainer"></div>
            <hr style="margin: 10px 0; border:0; border-top:1px solid var(--border-glass);">
            <label>Startdatum:</label><input type="date" id="planDate">
            <label>Ophaaltijd:</label><input type="time" id="planTime" value="08:00">
            <label>Bedrijf:</label><select id="planCompany" onchange="checkNewOption(this, 'company')"></select>
            <label>Chauffeur:</label><select id="planDriver" onchange="checkNewOption(this, 'driver')"></select>
            <label>Bestemming:</label><select id="planDestination" onchange="checkNewOption(this, 'destination')"></select>
            <label>Herhaling:</label>
            <select id="planRepeat" onchange="toggleEndDate()">
                <option value="none">Geen (eenmalig)</option>
                <option value="daily">Elke dag</option>
                <option value="alternate">Om de dag</option>
                <option value="mwf">Ma, Wo, Vrij</option>
                <option value="tts">Di, Do, Za</option>
            </select>
            <div id="endDateContainer" style="display: none;">
                <label>Tot einddatum:</label><input type="date" id="planEndDate">
            </div>
            <label>Opmerking:</label><input type="text" id="planNote" placeholder="Optioneel">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('planningModal')">Sluiten</button>
                <button class="btn-confirm" onclick="addPlannedRide()">Inplannen</button>
            </div>
        </div>
    </div>

    <div class="modal" id="reportModal">
        <div class="modal-content">
            <h3>Rapportage & Export</h3>
            <label>Startdatum:</label><input type="date" id="startDate">
            <label>Einddatum:</label><input type="date" id="endDate">
            <div class="modal-buttons" style="flex-direction:column; gap:8px;">
                <button class="btn-confirm" onclick="generatePDFReport()">📄 Open & Print PDF</button>
                <button class="btn-excel" onclick="generateExcelReport()">📊 Exporteer naar Excel (CSV)</button>
                <button class="btn-cancel" onclick="closeModal('reportModal')">Sluiten</button>
            </div>
        </div>
    </div>

    <div class="modal" id="diaryModal">
        <div class="modal-content">
            <h3>Opgeslagen Ritten</h3>
            <div class="list-container" id="diaryListContainer"></div>
            <button class="btn-confirm" onclick="closeModal('diaryModal')" style="width:100%;">Sluiten</button>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Instellingen & Cloud</h3>
            <label>Automatische PDF Tijd:</label>
            <input type="time" id="configPdfTime" value="17:00">
            <label style="margin-top: 10px;">JSONBin API Key:</label>
            <input type="text" id="apiKeyInput" placeholder="API Key ($2a$10$...)">
            <label>JSONBin Bin ID:</label>
            <input type="text" id="binIdInput" placeholder="Bin ID">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('settingsModal')">Sluiten</button>
                <button class="btn-confirm" onclick="saveSettings()">Opslaan & Sync</button>
            </div>
        </div>
    </div>

    <script>
        let rides = [];
        let planned = [];
        let optionsList = {
            company: ['Zorginstelling A', 'Cliënt B', 'Dagbesteding C'],
            driver: ['Chauffeur 1', 'Chauffeur 2'],
            destination: ['Plantage', 'Ziekenhuis', 'Stadscentrum']
        };

        let isDriving = false;
        let startTime = null;
        let timerInterval = null;

        let pdfTargetTime = localStorage.getItem('taxi_pdf_time') || '17:00';
        let pdfGeneratedDays = JSON.parse(localStorage.getItem('taxi_pdf_generated')) || {};
        let apiKey = localStorage.getItem('taxi_jsonbin_apikey') || '';
        let binId = localStorage.getItem('taxi_jsonbin_binid') || '';

        window.onload = async function() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = todayStr;
            document.getElementById('endDate').value = todayStr;
            document.getElementById('planDate').value = todayStr;
            document.getElementById('planEndDate').value = todayStr;

            updateDropdowns();

            if (apiKey && binId) {
                await syncWithCloud(false);
            } else {
                document.getElementById('syncStatus').innerText = 'Cloud: Niet ingesteld';
            }
            checkTodayPlanning();
            checkAutoPDFTrigger();
            setInterval(checkAutoPDFTrigger, 60000);
        };

        function checkAutoPDFTrigger() {
            const todayStr = new Date().toISOString().split('T')[0];
            if (pdfGeneratedDays[todayStr]) {
                document.getElementById('autoPdfBanner').style.display = 'none';
                return;
            }

            const now = new Date();
            const currentTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            if (currentTime >= pdfTargetTime) {
                document.getElementById('autoPdfBanner').style.display = 'block';
            } else {
                document.getElementById('autoPdfBanner').style.display = 'none';
            }
        }

        function generateAutoPDF() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = todayStr;
            document.getElementById('endDate').value = todayStr;
            generatePDFReport();

            pdfGeneratedDays[todayStr] = true;
            localStorage.setItem('taxi_pdf_generated', JSON.stringify(pdfGeneratedDays));
            document.getElementById('autoPdfBanner').style.display = 'none';
        }

        function openModal(modalId) {
            if (modalId === 'planningModal') renderPlannedList();
            if (modalId === 'diaryModal') renderDiaryList();
            if (modalId === 'settingsModal') {
                document.getElementById('configPdfTime').value = pdfTargetTime;
                document.getElementById('apiKeyInput').value = apiKey;
                document.getElementById('binIdInput').value = binId;
            }
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        async function syncWithCloud(showAlert) {
            if (!apiKey) {
                if (showAlert) alert('Stel eerst je API Key in via het wolkje (☁️).');
                return;
            }

            document.getElementById('syncStatus').innerText = 'Cloud: Synchroniseren...';

            try {
                if (!binId) {
                    const createRes = await fetch('https://api.jsonbin.io/v3/b', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': apiKey,
                            'X-Bin-Private': 'true'
                        },
                        body: JSON.stringify({ rides: [], planned: [], optionsList: optionsList, pdfTargetTime: pdfTargetTime, pdfGeneratedDays: pdfGeneratedDays })
                    });
                    const createData = await createRes.json();
                    if (createData.metadata && createData.metadata.id) {
                        binId = createData.metadata.id;
                        localStorage.setItem('taxi_jsonbin_binid', binId);
                    }
                }

                const getRes = await fetch('https://api.jsonbin.io/v3/b/' + binId + '/latest', {
                    headers: { 'X-Master-Key': apiKey }
                });
                const getData = await getRes.json();

                if (getData.record) {
                    if (getData.record.rides) rides = getData.record.rides;
                    if (getData.record.planned) planned = getData.record.planned;
                    if (getData.record.optionsList) optionsList = getData.record.optionsList;
                    if (getData.record.pdfTargetTime) {
                        pdfTargetTime = getData.record.pdfTargetTime;
                        localStorage.setItem('taxi_pdf_time', pdfTargetTime);
                    }
                    if (getData.record.pdfGeneratedDays) {
                        pdfGeneratedDays = getData.record.pdfGeneratedDays;
                        localStorage.setItem('taxi_pdf_generated', JSON.stringify(pdfGeneratedDays));
                    }
                    document.getElementById('syncStatus').innerText = 'Cloud: Verbonden';
                    if (showAlert) alert('Verbonden & gesynchroniseerd!');
                }
                updateDropdowns();
                checkTodayPlanning();
                checkAutoPDFTrigger();
            } catch (error) {
                console.error(error);
                document.getElementById('syncStatus').innerText = 'Cloud: Fout bij sync';
            }
        }

        async function pushToCloud() {
            if (!apiKey || !binId) return;
            try {
                await fetch('https://api.jsonbin.io/v3/b/' + binId, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify({ rides: rides, planned: planned, optionsList: optionsList, pdfTargetTime: pdfTargetTime, pdfGeneratedDays: pdfGeneratedDays })
                });
                document.getElementById('syncStatus').innerText = 'Cloud: Opgeslagen';
            } catch (error) {
                console.error(error);
                document.getElementById('syncStatus').innerText = 'Cloud: Opslaan mislukt';
            }
        }

        function updateDropdowns() {
            ['rideCompany', 'planCompany'].forEach(function(id) { populateSelect(id, optionsList.company); });
            ['rideDriver', 'planDriver'].forEach(function(id) { populateSelect(id, optionsList.driver); });
            ['rideDestination', 'planDestination'].forEach(function(id) { populateSelect(id, optionsList.destination); });
        }

        function populateSelect(elementId, items) {
            const select = document.getElementById(elementId);
            if (!select) return;
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- Maak keuze of voeg toe --</option>';
            items.forEach(function(item) {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                select.appendChild(opt);
            });
            select.innerHTML += '<option value="__new__" style="font-weight:bold; color:var(--neon-cyan);">+ Nieuwe toevoegen...</option>';
            if (items.includes(currentVal)) select.value = currentVal;
        }

        async function checkNewOption(selectElement, type) {
            if (selectElement.value === '__new__') {
                const newVal = prompt('Voer een nieuwe naam in:');
                if (newVal && newVal.trim() !== '') {
                    const cleaned = newVal.trim();
                    if (!optionsList[type].includes(cleaned)) {
                        optionsList[type].push(cleaned);
                        await pushToCloud();
                        updateDropdowns();
                        selectElement.value = cleaned;
                    } else {
                        selectElement.value = cleaned;
                    }
                } else {
                    selectElement.value = '';
                }
            }
        }

        function toggleEndDate() {
            const repeat = document.getElementById('planRepeat').value;
            document.getElementById('endDateContainer').style.display = repeat === 'none' ? 'none' : 'block';
        }

        function checkTodayPlanning() {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayRides = planned.filter(function(p) { return p.date === todayStr; });
            const banner = document.getElementById('scheduledBanner');

            if (todayRides.length > 0) {
                let html = '';
                todayRides.forEach(function(r) {
                    html += '<div>⏰ <span class="badge-green">' + (r.time || '00:00') + '</span> - 🚗 <b>' + r.company + '</b> naar ' + r.destination + '</div>';
                });
                document.getElementById('scheduledDetailsText').innerHTML = html;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        function startFirstScheduledRide() {
            const todayStr = new Date().toISOString().split('T')[0];
            const match = planned.find(function(p) { return p.date === todayStr; });

            if (match) {
                document.getElementById('rideCompany').value = match.company;
                document.getElementById('rideDriver').value = match.driver;
                document.getElementById('rideDestination').value = match.destination;
                document.getElementById('rideNote').value = match.note || '';

                planned = planned.filter(function(p) { return p !== match; });
                pushToCloud();
                checkTodayPlanning();
            }
            toggleRide();
        }

        function toggleRide() {
            const btn = document.getElementById('mainActionBtn');
            const status = document.getElementById('meterStatus');
            const form = document.getElementById('activeRideForm');

            if (!isDriving) {
                isDriving = true;
                startTime = new Date();
                
                btn.innerText = 'RIT STOPPEN & OPSLAAN';
                btn.className = 'action-main-btn btn-stop';
                status.innerText = 'Status: Rit bezig...';
                form.style.display = 'block';

                timerInterval = setInterval(function() {
                    const now = new Date();
                    const diff = Math.floor((now - startTime) / 1000);
                    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                    const s = String(diff % 60).padStart(2, '0');
                    document.getElementById('timerDisplay').innerText = h + ':' + m + ':' + s;
                }, 1000);
            } else {
                const stopTime = new Date();
                const company = document.getElementById('rideCompany').value || 'Onbekend';
                const driver = document.getElementById('rideDriver').value || 'Onbekend';
                const destination = document.getElementById('rideDestination').value || 'Onbekend';
                const note = document.getElementById('rideNote').value.trim();

                // Nieuwste rit komt bovenaan via unshift()
                rides.unshift({
                    date: startTime.toISOString().split('T')[0],
                    startDateTime: startTime.toLocaleString('nl-NL'),
                    stopDateTime: stopTime.toLocaleString('nl-NL'),
                    durationMinutes: Math.floor((stopTime - startTime) / 60000),
                    company: company,
                    driver: driver,
                    destination: destination,
                    note: note
                });

                pushToCloud();
                clearInterval(timerInterval);
                isDriving = false;
                btn.innerText = 'RIT STARTEN';
                btn.className = 'action-main-btn btn-start';
                status.innerText = 'Status: Vrij / Rit opgeslagen';
                document.getElementById('timerDisplay').innerText = '00:00:00';
                form.style.display = 'none';

                document.getElementById('rideCompany').value = '';
                document.getElementById('rideDriver').value = '';
                document.getElementById('rideDestination').value = '';
                document.getElementById('rideNote').value = '';
                alert('Rit succesvol opgeslagen en gesynchroniseerd!');
            }
        }

        function renderPlannedList() {
            const container = document.getElementById('plannedListContainer');
            container.innerHTML = '';
            if (planned.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 10px;">Geen geplande ritten.</p>';
            } else {
                planned.forEach(function(p, idx) {
                    container.innerHTML += '<div class="list-card"><div class="list-card-header"><span>📅 ' + p.date + ' om <span class="badge-green">' + p.time + '</span> - ' + p.company + '</span><button class="delete-btn" onclick="deletePlanned(' + idx + ')">Wis</button></div><div class="list-card-row">Naar: ' + p.destination + ' | Chauffeur: ' + p.driver + '</div></div>';
                });
            }
        }

        async function addPlannedRide() {
            const dateStr = document.getElementById('planDate').value;
            const time = document.getElementById('planTime').value;
            const company = document.getElementById('planCompany').value;
            const driver = document.getElementById('planDriver').value;
            const destination = document.getElementById('planDestination').value;
            const repeat = document.getElementById('planRepeat').value;
            const endDateStr = document.getElementById('planEndDate').value;
            const note = document.getElementById('planNote').value.trim();

            if (!dateStr || !company || company === '__new__') {
                alert('Vul een geldige datum en bedrijf in.');
                return;
            }

            let currDate = new Date(dateStr + 'T00:00:00');
            let limitDate = repeat === 'none' ? new Date(dateStr + 'T00:00:00') : new Date((endDateStr || dateStr) + 'T00:00:00');

            let count = 0;
            while (currDate <= limitDate && count < 500) {
                let day = currDate.getDay();
                let add = false;
                if (repeat === 'none' && count === 0) add = true;
                else if (repeat === 'daily') add = true;
                else if (repeat === 'alternate' && count % 2 === 0) add = true;
                else if (repeat === 'mwf' && (day === 1 || day === 3 || day === 5)) add = true;
                else if (repeat === 'tts' && (day === 2 || day === 4 || day === 6)) add = true;

                if (add) {
                    let y = currDate.getFullYear();
                    let m = String(currDate.getMonth() + 1).padStart(2, '0');
                    let d = String(currDate.getDate()).padStart(2, '0');
                    planned.push({ date: y + '-' + m + '-' + d, time: time, company: company, driver: driver, destination: destination, repeat: repeat, note: note });
                }
                if (repeat === 'none') break;
                currDate.setDate(currDate.getDate() + 1);
                count++;
            }

            await pushToCloud();
            checkTodayPlanning();
            renderPlannedList();
            closeModal('planningModal');
            alert('Rit(ten) ingepland!');
        }

        async function deletePlanned(idx) {
            planned.splice(idx, 1);
            await pushToCloud();
            checkTodayPlanning();
            renderPlannedList();
        }

        function renderDiaryList() {
            const container = document.getElementById('diaryListContainer');
            container.innerHTML = '';
            if (rides.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 15px;">Nog geen ritten geregistreerd.</p>';
            } else {
                rides.forEach(function(r, idx) {
                    let dur = r.durationMinutes || 0;
                    let badge = dur >= 48 ? 'badge-red' : 'badge-green';
                    container.innerHTML += '<div class="list-card"><div class="list-card-header"><span>🚗 ' + r.company + ' (' + r.date + ')</span><button class="delete-btn" onclick="deleteRide(' + idx + ')">Wis</button></div><div class="list-card-row">Duur: <span class="' + badge + '">' + dur + ' min</span> | Chauffeur: ' + r.driver + '</div></div>';
                });
            }
        }

        async function deleteRide(idx) {
            if (confirm('Verwijderen?')) {
                rides.splice(idx, 1);
                await pushToCloud();
                renderDiaryList();
            }
        }

        function generatePDFReport() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const filtered = rides.filter(function(r) { return r.date >= start && r.date <= end; });
            if (filtered.length === 0) { alert('Geen ritten in deze periode.'); return; }

            let html = '<html><head><title>Taxi Rapport</title><style>body{font-family:sans-serif;padding:25px; color:#1e293b;}h2{color:#0f172a; border-bottom:2px solid #00f2fe; padding-bottom:8px;}table{width:100%;border-collapse:collapse;margin-top:10px;}th,td{border:1px solid #cbd5e1;padding:8px;font-size:12px;text-align:left;}th{background:#f1f5f9;}</style></head><body><h2>🚗 Taxi Rittenstaat Rapport</h2><p>Periode: ' + start + ' t/m ' + end + '</p><table><tr><th>Datum</th><th>Start</th><th>Stop</th><th>Duur</th><th>Bedrijf</th><th>Chauffeur</th><th>Bestemming</th></tr>';
            filtered.forEach(function(r) {
                html += '<tr><td>' + r.date + '</td><td>' + r.startDateTime + '</td><td>' + r.stopDateTime + '</td><td>' + r.durationMinutes + 'm</td><td>' + r.company + '</td><td>' + r.driver + '</td><td>' + r.destination + '</td></tr>';
            });
            html += '</table><script>window.onload=function(){window.print();}<\/script></body></html>';
            let w = window.open(); w.document.write(html); w.document.close();
            closeModal('reportModal');
        }

        function generateExcelReport() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const filtered = rides.filter(function(r) { return r.date >= start && r.date <= end; });
            if (filtered.length === 0) { alert('Geen ritten in deze periode.'); return; }

            let csv = 'Datum;Start;Stop;Duur (min);Bedrijf;Chauffeur;Bestemming;Notitie\n';
            filtered.forEach(function(r) {
                csv += '"' + r.date + '";"' + r.startDateTime + '";"' + r.stopDateTime + '";"' + r.durationMinutes + '";"' + r.company + '";"' + r.driver + '";"' + r.destination + '";"' + (r.note || '') + '"\n';
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Taxi_Rapport_' + start + '_tot_' + end + '.csv';
            link.click();
            closeModal('reportModal');
        }

        function saveSettings() {
            pdfTargetTime = document.getElementById('configPdfTime').value || '06:00';
            localStorage.setItem('taxi_pdf_time', pdfTargetTime);

            apiKey = document.getElementById('apiKeyInput').value.trim();
            binId = document.getElementById('binIdInput').value.trim();
            localStorage.setItem('taxi_jsonbin_apikey', apiKey);
            localStorage.setItem('taxi_jsonbin_binid', binId);
            closeModal('settingsModal');
            syncWithCloud(true);
            checkAutoPDFTrigger();
        }
    </script>
</body>
