<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Tasker - Taxi Module</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    
    .primary-button { background: #3498db; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; transition: background 0.3s; }
    .primary-button:hover { background: #2980b9; }
    .secondary-button { background: #2ecc71; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
    .secondary-button:hover { background: #27ae60; }
    
    .badge { padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; font-size: 12px; display: inline-block; }
    .badge-gepland { background: #3498db; }
    .badge-bezig { background: #f39c12; }
    .badge-gereed { background: #27ae60; }

    .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 15px; }
    .tab-btn { padding: 10px 20px; cursor: pointer; background: #eee; border: none; font-weight: bold; font-size: 15px; border-top-left-radius: 6px; border-top-right-radius: 6px; margin-right: 5px; }
    .tab-btn.active { background: white; border: 2px solid #ddd; border-bottom: 2px solid white; color: #3498db; margin-bottom: -2px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #f2f2f2; }

    .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    .close { float: right; font-size: 24px; font-weight: bold; cursor: pointer; color: #aaa; }
    .close:hover { color: black; }
    
    .time-buttons-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .big-btn { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: center; }
    .btn-start { background: #27ae60; }
    .btn-stop { background: #c0392b; }
    .time-display { font-size: 13px; margin-top: 5px; color: #eee; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <h2>Taxi Afspraak Inplannen</h2>
  
  <div class="form-group">
    <label for="taxiDatum">Startdatum:</label>
    <input type="date" id="taxiDatum">
  </div>

  <div class="form-group">
    <label for="taxiTijd">Ophaaltijd:</label>
    <input type="time" id="taxiTijd">
  </div>

  <div class="form-group">
    <label for="bestemmingSelect">Bestemming:</label>
    <select id="bestemmingSelect" onchange="checkNieuweBestemming(this, 'nieuweBestemmingDiv')">
      <option value="Ziekenhuis">Ziekenhuis</option>
      <option value="Dialyse Centrum">Dialyse Centrum</option>
      <option value="__NIEUW__">+ Nieuwe toevoegen...</option>
    </select>
  </div>
  <div class="form-group" id="nieuweBestemmingDiv" style="display:none;">
    <label for="nieuweBestemmingInput">Nieuwe Bestemming:</label>
    <input type="text" id="nieuweBestemmingInput" placeholder="Typ nieuwe bestemming...">
  </div>

  <div class="form-group">
    <label for="bedrijfSelect">Bedrijf:</label>
    <select id="bedrijfSelect" onchange="checkNieuweBedrijf(this, 'nieuwBedrijfDiv')">
      <option value="UMCG">UMCG</option>
      <option value="Maxima">Maxima</option>
      <option value="__NIEUW__">+ Nieuwe toevoegen...</option>
    </select>
  </div>
  <div class="form-group" id="nieuwBedrijfDiv" style="display:none;">
    <label for="nieuwBedrijfInput">Nieuw Bedrijf:</label>
    <input type="text" id="nieuwBedrijfInput" placeholder="Typ nieuw bedrijf...">
  </div>

  <div class="form-group">
    <label for="herhaling">Herhaling:</label>
    <select id="herhaling">
      <option value="Geen">Geen</option>
      <option value="ma wo vrij">ma wo vrij</option>
      <option value="di do vrij">di do vrij</option>
      <option value="elke dag">elke dag</option>
      <option value="om de dag">om de dag</option>
    </select>
  </div>

  <div class="form-group">
    <label for="herhalingEinddatum">Herhalen tot en met einddatum:</label>
    <input type="date" id="herhalingEinddatum">
  </div>

  <div class="form-group">
    <label for="opmerking">Opmerking:</label>
    <input type="text" id="opmerking" placeholder="Bijv. Rolstoel mee...">
  </div>
  
  <button class="primary-button" onclick="slaTaxiOp()">+ Taxi Opslaan</button>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="openTab(event, 'tabGepland')">Geplande Ritten</button>
    <button class="tab-btn" onclick="openTab(event, 'tabGereed')">Gereed Ritten</button>
  </div>

  <div id="tabGepland" class="tab-content active">
    <h2>Overzicht Geplande Ritten</h2>
    <table id="actiefTable">
      <thead>
        <tr>
          <th>Status</th>
          <th>Datum</th>
          <th>Tijd</th>
          <th>Bestemming</th>
          <th>Bedrijf</th>
          <th>Actie</th>
        </tr>
      </thead>
      <tbody id="actiefBody"><tr><td colspan="6" style="text-align:center;">Gegevens laden...</td></tr></tbody>
    </table>
  </div>

  <div id="tabGereed" class="tab-content">
    <h2>Overzicht Gereed Ritten</h2>
    <div class="form-group">
      <label for="zoekTerm">Zoek op dag, periode, bestemming of bedrijf:</label>
      <input type="text" id="zoekTerm" placeholder="Typ om te filteren..." onkeyup="laadGereedOverzicht()">
    </div>
    
    <div style="margin-bottom: 15px;">
      <button class="secondary-button" onclick="exporteer('pdf')">Exporteer naar PDF (LuukData)</button>
      <button class="secondary-button" onclick="exporteer('excel')">Exporteer naar Excel (LuukData)</button>
    </div>

    <table id="gereedTable">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Tijd</th>
          <th>Bestemming</th>
          <th>Bedrijf</th>
          <th>Start / Stop</th>
          <th>Opmerking</th>
        </tr>
      </thead>
      <tbody id="gereedBody"><tr><td colspan="6" style="text-align:center;">Gegevens laden...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="sluitModal()">&times;</span>
    <h2>Rit Bewerken & Start/Stop</h2>
    <input type="hidden" id="editId">
    
    <div class="form-group">
      <label for="editDatum">Datum:</label>
      <input type="date" id="editDatum">
    </div>
    <div class="form-group">
      <label for="editTijd">Ophaaltijd:</label>
      <input type="time" id="editTijd">
    </div>
    
    <div class="form-group">
      <label for="editBestemmingSelect">Bestemming:</label>
      <select id="editBestemmingSelect" onchange="checkNieuweBestemming(this, 'editNieuweBestemmingDiv')">
        <option value="Ziekenhuis">Ziekenhuis</option>
        <option value="Dialyse Centrum">Dialyse Centrum</option>
        <option value="__NIEUW__">+ Nieuwe toevoegen...</option>
      </select>
    </div>
    <div class="form-group" id="editNieuweBestemmingDiv" style="display:none;">
      <label for="editNieuweBestemmingInput">Nieuwe Bestemming:</label>
      <input type="text" id="editNieuweBestemmingInput" placeholder="Typ nieuwe bestemming...">
    </div>

    <div class="form-group">
      <label for="editBedrijfSelect">Bedrijf:</label>
      <select id="editBedrijfSelect" onchange="checkNieuweBedrijf(this, 'editNieuwBedrijfDiv')">
        <option value="UMCG">UMCG</option>
        <option value="Maxima">Maxima</option>
        <option value="__NIEUW__">+ Nieuwe toevoegen...</option>
      </select>
    </div>
    <div class="form-group" id="editNieuwBedrijfDiv" style="display:none;">
      <label for="editNieuwBedrijfInput">Nieuw Bedrijf:</label>
      <input type="text" id="editNieuwBedrijfInput" placeholder="Typ nieuw bedrijf...">
    </div>

    <div class="form-group">
      <label for="editOpmerking">Opmerking:</label>
      <input type="text" id="editOpmerking">
    </div>

    <label>Tijden vastleggen:</label>
    <div class="time-buttons-container">
      <button type="button" class="big-btn btn-start" onclick="legStartTijdVastInModal()">
        Start Tijd
        <div class="time-display" id="modalDisplayStart">Nog niet ingesteld</div>
      </button>
      <button type="button" class="big-btn btn-stop" onclick="legStopTijdVastInModal()">
        Stop Tijd
        <div class="time-display" id="modalDisplayStop">Nog niet ingesteld</div>
      </button>
    </div>

    <button class="primary-button" onclick="bewerkRitOpslaan()">Wijzigingen Opslaan</button>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlyX0g7xgSS5eYF6-R0QJlLywflW4Gz9nmK7y30Ahet50tKbe-I9Ybud1TtKI7tKWw/exec";

  let actieveRittenLijst = [];
  let modalStartTijd = '';
  let modalStopTijd = '';

  function openTab(evt, tabName) {
    const contents = document.getElementsByClassName('tab-content');
    for (let c of contents) c.classList.remove('active');
    const buttons = document.getElementsByClassName('tab-btn');
    for (let b of buttons) b.classList.remove('active');
    document.getElementById(tabName).classList.add('active');
    evt.currentTarget.classList.add('active');
  }

  // Hulpfunctie om tijd netjes te formatteren (snijdt eventuele ISO rotzooi eraf)
  function formatteerTijd(tijdStr) {
    if (!tijdStr) return '';
    // Als de string een 'T' bevat (zoals uit de spreadsheet), haal dan het uur/minuut deel eruit
    if (tijdStr.includes('T')) {
      try {
        const parts = tijdStr.split('T');
        if (parts[1]) {
          return parts[1].substring(0, 5); // pakt "HH:mm"
        }
      } catch (e) {
        return tijdStr;
      }
    }
    // Als het al een gewone korte tijd is (bijv. "21:30:00" of "21:30")
    if (tijdStr.length >= 5) {
      return tijdStr.substring(0, 5);
    }
    return tijdStr;
  }

  function laadDropdowns() {
    fetch(WEB_APP_URL + "?actie=getBestemmingen")
      .then(res => res.json())
      .then(data => {
        if (data && data.bestemmingen && data.bedrijven) {
          vulSelect('bestemmingSelect', data.bestemmingen, 'nieuweBestemmingDiv');
          vulSelect('bedrijfSelect', data.bedrijven, 'nieuwBedrijfDiv');
          vulSelect('editBestemmingSelect', data.bestemmingen, 'editNieuweBestemmingDiv');
          vulSelect('editBedrijfSelect', data.bedrijven, 'editNieuwBedrijfDiv');
        }
      })
      .catch(err => console.warn("Kon dropdowns niet laden:", err));
  }

  function vulSelect(selectId, items, nieuwDivId) {
    const select = document.getElementById(selectId);
    if (!select) return;
    const huidigeWaarde = select.value;
    select.innerHTML = '';
    
    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      select.appendChild(opt);
    });
    
    const optNieuw = document.createElement('option');
    optNieuw.value = '__NIEUW__';
    optNieuw.textContent = '+ Nieuwe toevoegen...';
    select.appendChild(optNieuw);
    
    if (huidigeWaarde && huidigeWaarde !== '__NIEUW__') {
      select.value = huidigeWaarde;
    }
  }

  function checkNieuweBestemming(selectElement, divId) {
    document.getElementById(divId).style.display = (selectElement.value === '__NIEUW__') ? 'block' : 'none';
  }

  function checkNieuweBedrijf(selectElement, divId) {
    document.getElementById(divId).style.display = (selectElement.value === '__NIEUW__') ? 'block' : 'none';
  }

  function getGekozenWaarde(selectId, inputId) {
    const select = document.getElementById(selectId);
    if (select.value === '__NIEUW__') {
      return document.getElementById(inputId).value.trim();
    }
    return select.value;
  }

  function slaTaxiOp() {
    const startDatum = document.getElementById('taxiDatum').value;
    const tijd = document.getElementById('taxiTijd').value;
    const bestemming = getGekozenWaarde('bestemmingSelect', 'nieuweBestemmingInput');
    const bedrijf = getGekozenWaarde('bedrijfSelect', 'nieuwBedrijfInput');
    const herhaling = document.getElementById('herhaling').value;
    const herhalingEinddatum = document.getElementById('herhalingEinddatum').value;
    const opmerking = document.getElementById('opmerking').value;

    if (!startDatum) {
      alert('Kies in ieder geval een startdatum.');
      return;
    }

    let datumsLijst = berekenHerhalendeDatums(startDatum, herhaling, herhalingEinddatum);

    if (datumsLijst.length === 0) {
      alert('Geen datums om op te slaan.');
      return;
    }

    slaDatumsReeksOp(datumsLijst, {
      tijd, bestemming, bedrijf, herhaling, herhalingEinddatum, opmerking, startTijd: '', stopTijd: ''
    });
  }

  function berekenHerhalendeDatums(startStr, herhaling, eindStr) {
    let datums = [];
    let curr = new Date(startStr);
    let eind = eindStr ? new Date(eindStr) : new Date(startStr);

    if (!eindStr || herhaling === 'Geen' || curr > eind) {
      datums.push(startStr);
      return datums;
    }

    let teller = 0;
    while (curr <= eind && teller < 365) {
      let dagVanDeWeek = curr.getDay(); 

      let toevoegen = false;
      if (herhaling === 'elke dag') {
        toevoegen = true;
      } else if (herhaling === 'ma wo vrij' && (dagVanDeWeek === 1 || dagVanDeWeek === 3 || dagVanDeWeek === 5)) {
        toevoegen = true;
      } else if (herhaling === 'di do vrij' && (dagVanDeWeek === 2 || dagVanDeWeek === 4 || dagVanDeWeek === 5)) {
        toevoegen = true;
      } else if (herhaling === 'om de dag') {
        toevoegen = true;
      }

      if (toevoegen || herhaling === 'Geen') {
        let jaar = curr.getFullYear();
        let maand = String(curr.getMonth() + 1).padStart(2, '0');
        let dag = String(curr.getDate()).padStart(2, '0');
        datums.push(`${jaar}-${maand}-${dag}`);
      }

      if (herhaling === 'om de dag') {
        curr.setDate(curr.getDate() + 2);
      } else {
        curr.setDate(curr.getDate() + 1);
      }
      teller++;
    }

    if (datums.length === 0) {
      datums.push(startStr);
    }

    return datums;
  }

  async function slaDatumsReeksOp(datums, basisData) {
    let successCount = 0;
    for (let datum of datums) {
      let payload = { actie: 'opslaan', datum: datum, ...basisData };
      try {
        let res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        let json = await res.json();
        if (json) successCount++;
      } catch (e) {
        console.warn("Fout bij opslaan datum " + datum, e);
      }
    }

    alert(successCount + " rit(ten) succesvol ingepland t/m " + (basisData.herhalingEinddatum || basisData.datum) + "!");
    
    document.getElementById('taxiTijd').value = '';
    document.getElementById('opmerking').value = '';
    document.getElementById('herhalingEinddatum').value = '';
    document.getElementById('nieuweBestemmingInput').value = '';
    document.getElementById('nieuwBedrijfInput').value = '';
    document.getElementById('nieuweBestemmingDiv').style.display = 'none';
    document.getElementById('nieuwBedrijfDiv').style.display = 'none';
    laadDropdowns();
    laadAlles();
  }

  function laadAlles() {
    laadActiefOverzicht();
    laadGereedOverzicht();
  }

  function laadActiefOverzicht() {
    fetch(WEB_APP_URL + "?actie=getActief")
      .then(res => res.json())
      .then(regels => {
        actieveRittenLijst = regels || [];
        const tbody = document.getElementById('actiefBody');
        tbody.innerHTML = '';
        
        if (!regels || regels.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Geen geplande ritten gevonden</td></tr>';
          return;
        }

        regels.forEach(item => {
          const tr = document.createElement('tr');
          let badgeClass = 'badge-gepland';
          if (item.status === 'Bezig') badgeClass = 'badge-bezig';
          
          tr.innerHTML = `
            <td><span class="badge ${badgeClass}">${item.status}</span></td>
            <td>${item.datum}</td>
            <td>${formatteerTijd(item.tijd)}</td>
            <td>${item.bestemming || ''}</td>
            <td>${item.bedrijf || ''}</td>
            <td><button class="secondary-button" onclick="openBewerkModal('${item.id}')">Bewerken</button></td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => console.warn("Kon actieve overzicht niet laden:", err));
  }

  function laadGereedOverzicht() {
    const zoekTerm = encodeURIComponent(document.getElementById('zoekTerm').value);
    fetch(WEB_APP_URL + "?actie=getGereed&zoek=" + zoekTerm)
      .then(res => res.json())
      .then(regels => {
        const tbody = document.getElementById('gereedBody');
        tbody.innerHTML = '';
        
        if (!regels || regels.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Geen gereed ritten gevonden</td></tr>';
          return;
        }

        regels.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.datum}</td>
            <td>${formatteerTijd(item.tijd)}</td>
            <td>${item.bestemming || ''}</td>
            <td>${item.bedrijf || ''}</td>
            <td>Start: ${formatteerTijd(item.startTijd) || '-'}<br>Stop: ${formatteerTijd(item.stopTijd) || '-'}</td>
            <td>${item.opmerking || ''}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => console.warn("Kon gereed overzicht niet laden:", err));
  }

  function openBewerkModal(id) {
    const rit = actieveRittenLijst.find(r => r.id === id);
    if (!rit) return;

    document.getElementById('editId').value = rit.id;
    document.getElementById('editDatum').value = rit.datum;
    document.getElementById('editTijd').value = formatteerTijd(rit.tijd);
    document.getElementById('editOpmerking').value = rit.opmerking;

    setSelectNaarWaarde('editBestemmingSelect', 'editNieuweBestemmingDiv', 'editNieuweBestemmingInput', rit.bestemming);
    setSelectNaarWaarde('editBedrijfSelect', 'editNieuwBedrijfDiv', 'editNieuwBedrijfInput', rit.bedrijf);

    modalStartTijd = formatteerTijd(rit.startTijd) || '';
    modalStopTijd = formatteerTijd(rit.stopTijd) || '';
    
    document.getElementById('modalDisplayStart').textContent = modalStartTijd ? 'Vastgelegd: ' + modalStartTijd : 'Nog niet ingesteld';
    document.getElementById('modalDisplayStop').textContent = modalStopTijd ? 'Vastgelegd: ' + modalStopTijd : 'Nog niet ingesteld';

    document.getElementById('editModal').style.display = 'block';
  }

  function setSelectNaarWaarde(selectId, divId, inputId, waarde) {
    const select = document.getElementById(selectId);
    let gevonden = false;
    for (let opt of select.options) {
      if (opt.value === waarde) {
        select.value = waarde;
        gevonden = true;
        break;
      }
    }
    if (!gevonden && waarde) {
      select.value = '__NIEUW__';
      document.getElementById(divId).style.display = 'block';
      document.getElementById(inputId).value = waarde;
    } else {
      if (select.value !== '__NIEUW__') {
        document.getElementById(divId).style.display = 'none';
        document.getElementById(inputId).value = '';
      }
    }
  }

  function sluitModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  function legStartTijdVastInModal() {
    const nu = new Date();
    modalStartTijd = nu.toTimeString().split(' ')[0].substring(0, 5);
    document.getElementById('modalDisplayStart').textContent = 'Vastgelegd: ' + modalStartTijd;
  }

  function legStopTijdVastInModal() {
    const nu = new Date();
    modalStopTijd = nu.toTimeString().split(' ')[0].substring(0, 5);
    document.getElementById('modalDisplayStop').textContent = 'Vastgelegd: ' + modalStopTijd;
  }

  function bewerkRitOpslaan() {
    const payload = {
      actie: 'update',
      id: document.getElementById('editId').value,
      datum: document.getElementById('editDatum').value,
      tijd: document.getElementById('editTijd').value,
      bestemming: getGekozenWaarde('editBestemmingSelect', 'editNieuweBestemmingInput'),
      bedrijf: getGekozenWaarde('editBedrijfSelect', 'editNieuwBedrijfInput'),
      opmerking: document.getElementById('editOpmerking').value,
      startTijd: modalStartTijd,
      stopTijd: modalStopTijd
    };

    fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      sluitModal();
      laadDropdowns();
      laadAlles();
    })
    .catch(err => alert('Fout bij bijwerken: ' + err));
  }

  function exporteer(formaat) {
    const payload = { actie: 'exporteer', formaat: formaat };
    fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => alert(res.message))
    .catch(err => alert('Export fout: ' + err));
  }

  window.onload = function() {
    laadDropdowns();
    laadAlles();
  };
</script>

</body>
</html>
